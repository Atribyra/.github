<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Exezyra on Solana. Build, backtest, and run on Binance, Hyperliquid, and MCP.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111c"/>
      <stop offset="1" stop-color="#0c1b2a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#163044" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.45"/>
  <circle cx="1080" cy="70" r="90" fill="none" stroke="#1d4e68" stroke-width="1"/>
  <circle cx="90" cy="350" r="70" fill="none" stroke="#1d4e68" stroke-width="1"/>
  <text x="600" y="150" text-anchor="middle" fill="#8fb4c9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="6">TRADING LAYER FOR AI AGENTS</text>
  <text x="600" y="220" text-anchor="middle" fill="#f4f8fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="1">BUILD, BACKTEST, AND RUN</text>
  <g fill="#14F195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4">
    <text x="330" y="286" text-anchor="middle">SOLANA</text>
    <text x="600" y="286" text-anchor="middle">SOLANA</text>
    <text x="870" y="286" text-anchor="middle">SOLANA</text>
  </g>
  <g fill="#d5e7f2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="3">
    <text x="330" y="322" text-anchor="middle">BINANCE</text>
    <text x="600" y="322" text-anchor="middle">HYPERLIQUID</text>
    <text x="870" y="322" text-anchor="middle">MCP</text>
  </g>
</svg>
